<svg id="AlugueNaHora_Logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100">
  <defs>
    <style>
      .blue { fill: #282F69; }
      .orange { fill: #F37021; }
      .white { fill: #FFFFFF; }
      .text-blue { fill: #282F69; font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 38px; }
      .text-orange { fill: #F37021; font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 38px; }
    </style>
  </defs>
  
  <!-- Rounded Rect Background for Icon -->
  <rect x="10" y="10" width="80" height="80" rx="15" class="blue"/>
  
  <!-- House Silhouette -->
  <path d="M50 28 L28 48 L28 72 L42 72 L42 58 L58 58 L58 72 L72 72 L72 48 Z" class="white"/>
  
  <!-- Vibrant Orange Tick -->
  <path d="M40 50 L52 62 L85 30" fill="none" stroke="#F37021" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Branding Text -->
  <text x="110" y="65" class="text-blue">Alugue</text>
  <text x="260" y="65" class="text-orange">na Hora</text>
</svg>